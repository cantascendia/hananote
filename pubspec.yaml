name: hananote
description: "Privacy-first MTF HRT health management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Routing
  go_router: ^15.0.0

  # Database (Encrypted)
  sqflite_sqlcipher: ^3.1.0+1
  path: ^1.9.1

  # Encryption & Security
  pointycastle: ^3.9.1
  flutter_secure_storage: ^9.2.4

  # Data Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0
  dartz: ^0.10.1

  # UI & Charts
  fl_chart: ^0.70.2
  google_fonts: ^6.2.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Utilities
  intl: ^0.20.2 # Compatible with flutter_localizations from the current Flutter SDK.
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0
  build_runner: ^2.4.14
  injectable_generator: ^2.7.0
  freezed: ^3.0.0
  json_serializable: ^6.9.0
  bloc_test: ^10.0.0 # Compatible with flutter_bloc 9.x.
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
